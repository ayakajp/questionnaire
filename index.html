<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卒業研究アンケート</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .btn-secondary { background-color: #6c757d; margin-bottom: 10px; }
    
    /* 画面切り替え用の表示制御 */
    .step { display: none; }
    .step.active { display: block; }
    
    #submittedMessage { display: none; padding: 20px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>卒業研究に関するアンケート</h2>

  <!-- 1. 回答済みの場合に表示するメッセージ -->
  <div id="submittedMessage">
    <p><strong>ご協力ありがとうございました。</strong></p>
    <p>この端末からは既に回答が送信されています。</p>
  </div>

  <!-- 2. アンケートフォーム -->
  <form id="surveyForm">

    <!-- 【STEP 1】同意画面 -->
    <div id="step1" class="step active">
      <div style="background-color: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
        <h3 style="margin-top: 0; font-size: 1.1em;">研究協力に関するお願い</h3>
        <p style="font-size: 0.9em; color: #555; line-height: 1.5;">
          本アンケートでご回答いただいたデータは、卒業研究の分析目的のみに使用し、個人が特定される形で公開されることはありません。
        </p>
        <label style="font-weight: normal; cursor: pointer;">
          <input type="checkbox" id="consentCheck" style="width: auto;"> 上記の内容に同意して回答する
        </label>
      </div>
      
      <!-- 同意画面からの「次へ」ボタン -->
      <button type="button" id="nextBtn" disabled onclick="goToStep(2)">次へ進む</button>
    </div>

    <!-- 【STEP 2】質問画面 -->
    <div id="step2" class="step">
      <div class="form-group">
        <label for="age">年代</label>
        <select id="age" required>
          <option value="">選択してください</option>
          <option value="10s">10代</option>
          <option value="20s">20代</option>
          <option value="30s">30代以上</option>
        </select>
      </div>

      <div class="form-group">
        <label for="feedback">ご意見・自由記述</label>
        <textarea id="feedback" rows="4" required></textarea>
      </div>

      <!-- 戻るボタン（必要に応じて設置） -->
      <button type="button" class="btn-secondary" onclick="goToStep(1)">＜ 同意画面に戻る</button>
      
      <!-- 送信ボタン -->
      <button type="submit" id="submitBtn">送信する</button>
    </div>

  </form>

  <script>
    // ★ご自身のGASのWebアプリURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxd7RiFBfInPgR0Xvpv8d6qFll1IGl_FeComBHgBuex3QLsjrw7K7NuaJw1bvos48riUQ/exec";

    const surveyForm = document.getElementById('surveyForm');
    const submittedMessage = document.getElementById('submittedMessage');

    // ★追加：画面（ステップ）を切り替える関数
    function goToStep(stepNumber) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNumber}`).classList.add('active');
      window.scrollTo(0, 0); // 画面上部にスクロール
    }

    // ★追加：同意チェックボックスで「次へ進む」ボタンを制御
    document.getElementById('consentCheck').addEventListener('change', (e) => {
      document.getElementById('nextBtn').disabled = !e.target.checked;
    });

    // 既存処理：ページ読み込み時に「すでに回答済みか」を判定
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('has_submitted_survey')) {
        surveyForm.style.display = 'none';
        submittedMessage.style.display = 'block';
      }
    });

    // 既存処理：フォーム送信処理
    surveyForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "送信中...";

      const payload = {
        age: document.getElementById('age').value,
        feedback: document.getElementById('feedback').value
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        localStorage.setItem('has_submitted_survey', 'true');
        alert('ご協力ありがとうございました！回答を受け付けました。');
        
        surveyForm.style.display = 'none';
        submittedMessage.style.display = 'block';

      } catch (error) {
        alert('送信に失敗しました。時間をおいて再度お試しください。');
        console.error(error);
        submitBtn.disabled = false;
        submitBtn.innerText = "送信する";
      }
    });
  </script>
</body>
</html>
