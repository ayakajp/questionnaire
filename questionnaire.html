<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卒業研究アンケート</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea, button { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>卒業研究に関するアンケート</h2>

  <form id="surveyForm">
    <div class="form-group">
      <label for="age">年代</label>
      <select id="age" required>
        <option value="">選択してください</option>
        <option value="10s">10代</option>
        <option value="20s">20代</option>
        <option value="30s">30代以上</option>
      </select>
    </div>

    <div class="form-group">
      <label for="feedback">ご意見・自由記述</label>
      <textarea id="feedback" rows="4" required></textarea>
    </div>

    <button type="submit" id="submitBtn">送信する</button>
  </form>

  <script>
    // ★手順1で取得したGASのWebアプリURLに差し替えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxd7RiFBfInPgR0Xvpv8d6qFll1IGl_FeComBHgBuex3QLsjrw7K7NuaJw1bvos48riUQ/exec";

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "送信中...";

      const payload = {
        age: document.getElementById('age').value,
        feedback: document.getElementById('feedback').value
      };

      try {
        // GASへの送信（no-cors モードで送信）
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('ご協力ありがとうございました！回答を受け付けました。');
        document.getElementById('surveyForm').reset();
        submitBtn.innerText = "送信完了";
      } catch (error) {
        alert('送信に失敗しました。時間をおいて再度お試しください。');
        console.error(error);
        submitBtn.disabled = false;
        submitBtn.innerText = "送信する";
      }
    });
  </script>
</body>
</html>
